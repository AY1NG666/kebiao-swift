name: Build IPA
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build and Package
        run: |
          cd Kebiao/Kebiao
          swiftc -o ~/Kebiao \
            -sdk $(xcrun --show-sdk-path --sdk iphoneos) \
            -target arm64-apple-ios16.0 \
            -framework SwiftUI -framework Foundation -framework UniformTypeIdentifiers \
            *.swift
          mkdir -p ~/Payload/Kebiao.app
          # Copy app icon (repo root → app bundle)
          cp ../../AppIcon-180.png ~/Payload/Kebiao.app/
          cat > ~/Payload/Kebiao.app/Info.plist << 'PEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>Kebiao</string>
          <key>CFBundleIdentifier</key><string>com.ayng.kebiao</string>
          <key>CFBundleName</key><string>课表</string>
          <key>CFBundleDisplayName</key><string>课表</string>
          <key>CFBundleVersion</key><string>30</string>
          <key>CFBundleShortVersionString</key><string>3.0</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>LSRequiresIPhoneOS</key><true/>
          <key>UILaunchScreen</key><dict/>
          <key>CFBundleIcons</key><dict>
            <key>CFBundlePrimaryIcon</key><dict>
              <key>CFBundleIconFiles</key><array><string>AppIcon-180</string></array>
            </dict>
          </dict>
          </dict></plist>
          PEOF
          cp ~/Kebiao ~/Payload/Kebiao.app/
          IPA_NAME="kebiao-v3.0-b30.ipa"
          IPA_DIR="$HOME"
          cd "$IPA_DIR" && zip -r "$IPA_NAME" Payload
          ls -lh "$IPA_DIR/$IPA_NAME"
          echo "ipa_dir=$IPA_DIR" >> $GITHUB_ENV
          echo "ipa_name=$IPA_NAME" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with: { name: kebiao-ipa-v3.0-b30, path: /Users/runner/kebiao-v*.ipa }
